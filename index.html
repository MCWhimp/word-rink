<style>
:root{
  --ice:#EEF7F0;--ice2:#FFFFFF;--ink:#0B3D2E;--ink2:#466B5A;--blue:#1E8449;--red:#D7263D;--gold:#E9A826;--green:#1F9E6B;--line:#C5DCCD;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ice:#071F15;--ice2:#0F2E22;--ink:#E8F5EC;--ink2:#9FC4AF;--blue:#3FBF72;--red:#F0506A;--gold:#F2B33D;--green:#3CC489;--line:#1F4A38;color-scheme:dark}}
:root[data-theme="dark"]{--ice:#071F15;--ice2:#0F2E22;--ink:#E8F5EC;--ink2:#9FC4AF;--blue:#3FBF72;--red:#F0506A;--gold:#F2B33D;--green:#3CC489;--line:#1F4A38;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ice);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.45;display:flex;flex-direction:column}
.disp{font-family:"Barlow Condensed","Barlow",system-ui,sans-serif;font-weight:800;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--ice2);border:2px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}

/* scoreboard */
.board{background:var(--ink);color:#fff;padding:12px 14px 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
:root[data-theme="dark"] .board{background:#04150E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .board{background:#04150E}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.cell{text-align:center}
.cell .n{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:34px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.cell .n.red{color:#FF5C70}.cell .n.white{color:#fff}
.cell .l{font-size:12px;opacity:.75;margin-top:2px}

main{flex:1;max-width:620px;width:100%;margin:0 auto;padding:16px 16px 90px}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;font-weight:800;line-height:1.05;margin:0}
h1{font-size:40px}h2{font-size:28px}h3{font-size:22px}
p{margin:.4em 0}
.muted{color:var(--ink2)}
.rink{border-top:4px solid var(--red);padding-top:12px;margin-top:22px}
.blueline{border-top:3px solid var(--blue);padding-top:10px;margin-top:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;border-radius:10px;padding:14px 18px;font-weight:600;font-size:18px;width:100%}
.btn.red{background:var(--red)}.btn.gold{background:var(--gold);color:#1a1200}.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.sm{width:auto;padding:8px 14px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--ice2);border-top:2px solid var(--line);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;padding:12px 4px 10px;font-size:13px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:20px}
nav.tabs button.on{color:var(--blue);font-weight:600}

/* cards */
.wcard{background:var(--ice2);border:2px solid var(--line);border-radius:14px;padding:18px}
.word{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:44px;line-height:1}
.pos{color:var(--ink2);font-style:italic;margin-left:6px;font-size:16px}
.sent{margin-top:14px;font-size:19px}
.sent b{color:var(--blue)}
.zh{color:var(--ink2)}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;background:var(--ice2);border:2px solid var(--line);border-radius:10px;padding:14px;font-size:18px;display:flex;gap:10px;align-items:center}
.opt .k{font-family:"Barlow Condensed",sans-serif;font-weight:800;color:var(--ink2);width:22px}
.opt.ok{border-color:var(--green);background:color-mix(in srgb,var(--green) 14%,var(--ice2))}
.opt.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--ice2))}
.opt:disabled{cursor:default}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--blue);transition:width .25s}
.fb{margin-top:12px;padding:12px;border-radius:10px;background:var(--ice2);border-left:5px solid var(--green)}
.fb.bad{border-left-color:var(--red)}
.xp-pop{position:fixed;left:50%;top:40%;transform:translateX(-50%);font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:46px;color:var(--gold);pointer-events:none;animation:pop .9s ease-out forwards;z-index:20;text-shadow:0 2px 0 rgba(0,0,0,.25)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50px)}}
@media (prefers-reduced-motion:reduce){.xp-pop{animation:none;opacity:0}.prog i{transition:none}}

.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.stat .v{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:24px}
.boxes{display:flex;gap:4px;align-items:flex-end;height:70px;margin:10px 0}
.boxes div{flex:1;background:var(--blue);border-radius:4px 4px 0 0;min-height:3px;position:relative}
.boxes div span{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:12px;color:var(--ink2)}
.boxes div.m{background:var(--green)}
.blab{display:flex;gap:4px;font-size:11px;color:var(--ink2)}.blab span{flex:1;text-align:center}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.badge{border:2px solid var(--line);border-radius:10px;padding:10px;font-size:14px}
.badge.got{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--ice2))}
.badge .e{font-size:22px}
.wl{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;border:1.5px solid var(--line);color:var(--ink2);white-space:nowrap}
.pill.b4,.pill.b5{border-color:var(--green);color:var(--green)}.pill.due{border-color:var(--red);color:var(--red)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:2px solid var(--line);border-radius:99px;padding:6px 12px;font-size:14px}.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.phase{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.phase .w{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:20px;color:var(--blue)}
.phase.now .w{color:var(--red)}
.lvl{display:flex;align-items:center;gap:12px}
.lvl .ring{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--gold) var(--p),var(--line) 0);display:grid;place-items:center}
.lvl .ring i{width:50px;height:50px;border-radius:50%;background:var(--ice2);display:grid;place-items:center;font-style:normal;font-size:26px}
.modal{position:fixed;inset:0;background:rgba(5,15,30,.6);display:grid;place-items:center;z-index:30;padding:20px}
.modal>div{background:var(--ice2);border-radius:14px;padding:22px;max-width:420px;width:100%}
.hidden{display:none}
.kb{font-size:13px;color:var(--ink2);margin-top:6px}
.timer{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:40px;color:var(--red)}
label.f{display:block;margin:12px 0 4px;font-weight:600;font-size:15px}
.tog{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sw{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative}.sw.on{background:var(--green)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}.sw.on::after{left:23px}
.spk{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--ice2);font-size:16px;vertical-align:middle;margin-left:8px;flex:none}.spk:active{background:var(--line)}.spk.big{width:42px;height:42px;font-size:20px}
.note{font-size:14px;color:var(--ink2);border:1.5px dashed var(--line);border-radius:10px;padding:10px;margin-top:10px}
</style>
</head>

const SENT=Object.assign({},IS1,IS2,IS3);const THEMES=[["soccer","⚽ Soccer"],["minecraft","⛏️ Minecraft"],["math","➗ Math"],["mix","🔀 Mix"]];
const AUDIO_BASE="audio/";let curAudio=null,voiceCache=null;
function sentKey(i,t){const s=SENT[WORDS[i][0]];const k=s?s.indexOf(t):-1;return k>=0?WORDS[i][0]+"-"+k:null}
function pickVoice(){if(voiceCache)return voiceCache;try{const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));const pref=["Ava","Samantha","Aria","Jenny","Zira","Google US English","Natural","Enhanced","Premium"];for(const p of pref){const v=vs.find(v=>v.name.includes(p));if(v){voiceCache=v;return v}}voiceCache=vs[0]||null;return voiceCache}catch(e){return null}}
function speak(text,key,rate){if(!text)return;if(curAudio){curAudio.pause();curAudio=null}try{speechSynthesis.cancel()}catch(e){}
  const fb=()=>{try{const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=rate||0.92;const v=pickVoice();if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}};
  if(!key){fb();return}const a=new Audio(AUDIO_BASE+encodeURIComponent(key)+".mp3");a.onerror=fb;curAudio=a;a.play().catch(fb)}
function spk(text,key,big){return `<button class="spk${big?" big":""}" data-say="${esc(text)}" data-key="${esc(key||"")}" aria-label="Play audio">🔊</button>`}
document.addEventListener("click",e=>{const b=e.target.closest(".spk");if(b){e.preventDefault();speak(b.dataset.say,b.dataset.key||null)}});
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=()=>{voiceCache=null}}
function sentOf(i){const s=SENT[WORDS[i][0]];if(!s)return WORDS[i][5];const t=S.theme||"mix";const k=t==="soccer"?0:t==="minecraft"?1:t==="math"?2:Math.floor(Math.random()*3);return s[k]}const MIDN=WORDS.length;const lvlOf=i=>i<MIDN?"Middle":"Upper";
// ---------- spaced repetition ----------
// Leitner boxes with expanding intervals (Ebbinghaus review-before-forgetting):
// box 0 unseen, 1 = review next day, 2 = 3 days, 3 = 7 days, 4 = 14 days, 5 = 30 days
const INTERVALS=[0,1,3,7,14,30];
const DAY=86400000;
const LEVELS=[[0,"Rookie","🧢"],[250,"Academy","⚽"],[600,"Starter","👟"],[1200,"Playmaker","⭐"],[2200,"Captain","🅲"],[3600,"Golden Boot","🥇"],[5500,"Legend","🏆"]];

 ["first","First match","🥅","Finish your first training session"],

 ["m150","150 in the net","🛡️","Master 150 words"],

 ["speed15","Sniper","🎯","15+ correct in one Shootout"],
 ["seen","Seen it all","👀","Introduce every word"],
];
const KEY="wordpitch-v1";
const todayKey=d=>{d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fresh=()=>({v:1,name:"",exam:"2027-01-09",perDay:8,zh:true,xp:0,streak:0,best:0,last:"",freezeUsed:"",badges:[],w:{},hist:{},intro:[],updated:0,reportUrl:"",pending:false,theme:"mix",autoSay:true});

let dbRef=null,dbUserId=null,saveTimer=null;

function audioKeys(){const ks=[];WORDS.forEach(w=>{ks.push(w[0]);const s=SENT[w[0]];if(s)s.forEach((_,k)=>ks.push(w[0]+"-"+k));const f=FORMS[w[0]];if(f)f.forEach(x=>ks.push(x[0]))});return ks}
function report(){if(!S.reportUrl)return;const t=todayKey();const h=S.hist[t]||{q:0,ok:0,nw:0,xp:0};
  const weak=Object.keys(S.w).filter(i=>S.w[i].b<=1&&S.w[i].l>0).sort((a,b)=>S.w[b].l-S.w[a].l).slice(0,15).map(i=>WORDS[i][0]+"("+S.w[i].l+")").join(", ");
  const body=JSON.stringify(Object.assign(summary(),{date:t,todayQ:h.q,todayAcc:h.q?Math.round(h.ok/h.q*100):"",todayNew:h.nw,todayXP:h.xp,weak,backup:btoa(unescape(encodeURIComponent(JSON.stringify(S))))}));

  fetch(S.reportUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body}).then(()=>{S.pending=false;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}).catch(()=>{})}
async function cloudInit(){try{if(!window.claude||!claude.use)return;const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);if(!db||!user)return;const id=await user.id();if(!id)return;dbUserId=id;

// ---------- state helpers ----------
const ws=i=>S.w[i]||{b:0,d:0,l:0,c:0};
function dueList(){const now=Date.now();return Object.keys(S.w).map(Number).filter(i=>S.w[i].b>0&&S.w[i].b<6&&S.w[i].d<=now)}
function masteredCount(){return Object.values(S.w).filter(x=>x.b>=4).length}
function unseen(){return WORDS.map((_,i)=>i).filter(i=>!S.w[i]||S.w[i].b===0)}
function daysToExam(){const e=new Date(S.exam+"T00:00:00");return Math.ceil((e-new Date())/DAY)}
function level(){let L=LEVELS[0],next=null;for(let i=0;i<LEVELS.length;i++){if(S.xp>=LEVELS[i][0]){L=LEVELS[i];next=LEVELS[i+1]||null}}return{L,next}}
function addXP(n){S.xp+=n;const p=document.createElement("div");p.className="xp-pop";p.textContent="+"+n+" XP";document.body.appendChild(p);setTimeout(()=>p.remove(),1000);checkBadges();updateBoard()}
function grade(i,ok){const x=ws(i);if(ok){x.b=Math.min(5,x.b+1);x.c++}else{x.b=1;x.l++}x.d=Date.now()+INTERVALS[x.b]*DAY;S.w[i]=x}
function touchStreak(){const t=todayKey();if(S.last===t)return;const y=todayKey(new Date(Date.now()-DAY));const y2=todayKey(new Date(Date.now()-2*DAY));
  if(S.last===y)S.streak++;
  else if(S.last===y2&&S.freezeUsed!==weekKey()){S.streak++;S.freezeUsed=weekKey()}// one free missed day per week
  else S.streak=1;
  S.last=t;S.best=Math.max(S.best,S.streak)}
function weekKey(){const d=new Date();const o=new Date(d.getFullYear(),0,1);return d.getFullYear()+"w"+Math.floor(((d-o)/DAY+o.getDay())/7)}
function logHist(k,n){const t=todayKey();S.hist[t]=S.hist[t]||{rev:0,nw:0,xp:0,ok:0,q:0};S.hist[t][k]+=n}
function checkBadges(){const m=masteredCount();const add=id=>{if(!S.badges.includes(id)){S.badges.push(id);toast("🏅 Badge unlocked: "+BADGES.find(b=>b[0]===id)[1])}};
  if(S.streak>=7)add("s7");if(S.streak>=21)add("s21");if(m>=50)add("m50");if(m>=150)add("m150");if(m>=WORDS.length)add("mall");if(S.intro.length>=WORDS.length)add("seen")}
function toast(msg){const d=document.createElement("div");d.className="xp-pop";d.style.fontSize="22px";d.style.top="30%";d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),1100)}

// ---------- quiz generation ----------
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function synQ(i){const w=WORDS[i];const correct=w[4][0];const pool=WORDS.filter((o,j)=>j!==i&&!o[4].some(s=>w[4].includes(s))&&o[4][0]!==correct);
  const ds=shuffle(pool).slice(0,3).map(o=>o[4][0]);return{type:"syn",i,prompt:w[0],opts:shuffle([correct,...ds]),ans:correct}}
function sentQ(i){const w=WORDS[i];const pool=WORDS.filter((o,j)=>j!==i&&o[1]===w[1]&&!o[4].some(s=>w[4].includes(s)));
  const ds=shuffle(pool).slice(0,3).map(o=>o[0]);return{type:"sent",i,prompt:sentOf(i),opts:shuffle([w[0],...ds]),ans:w[0]}}
function defQ(i){const w=WORDS[i];const pool=WORDS.filter((o,j)=>j!==i&&o[1]===w[1]&&!o[4].some(s=>w[4].includes(s)));
  const ds=shuffle(pool).slice(0,3).map(o=>o[2]);return{type:"def",i,prompt:w[0],opts:shuffle([w[2],...ds]),ans:w[2]}}
function formQ(i){const w=WORDS[i];const f=FORMS[w[0]];const pick=f[Math.floor(Math.random()*f.length)];const pool=WORDS.filter((o,j)=>j!==i&&!o[4].some(s=>w[4].includes(s)));
  const ds=shuffle(pool).slice(0,3).map(o=>o[2]);return{type:"form",i,prompt:pick[0],opts:shuffle([pick[1],...ds]),ans:pick[1],base:w[0]}}
function makeQ(i){const b=ws(i).b;if(b>=2&&FORMS[WORDS[i][0]]&&Math.random()<0.3)return formQ(i);if(b<=1)return Math.random()<.5?synQ(i):defQ(i);const r=Math.random();return r<.45?synQ(i):r<.85?sentQ(i):defQ(i)}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function pace(){const left=unseen().length;const d=daysToExam();const introDays=Math.max(1,Math.round((d-14)*6/7));// finish new words 2 weeks before exam, 6 training days/week
  return{left,d,rec:Math.min(15,Math.max(3,Math.ceil(left/introDays)))}}

function rToday(){const due=dueList();const t=todayKey();const h=S.hist[t]||{rev:0,nw:0,xp:0};const newLeft=Math.max(0,S.perDay-h.nw);const un=unseen().length;const nNew=Math.min(newLeft,un);
  const {L,next}=level();const p=next?Math.round((S.xp-L[0])/(next[0]-L[0])*100):100;const pc=pace();

  ${pc.rec>S.perDay&&un>0?`<div class="note">Pace check: ${pc.left} words still unseen and ${pc.d} days to the exam. Raising new words/day to <b>${pc.rec}</b> would finish all new words two weeks before the test. Change it in Setup if you want.</div>`:""}
  <p class="muted" style="margin-top:12px;font-size:15px">Today’s pitch — pick where the sentences come from:</p><div class="chips">${THEMES.map(t=>`<button class="chip th ${(S.theme||"mix")===t[0]?"on":""}" data-th="${t[0]}">${t[1]}</button>`).join("")}</div>
  <div class="row" style="margin-top:8px">
    <button class="btn" id="startBtn" ${done?"disabled":""}>${due.length?"Start reviews + new words":"Start new words"}</button>

  </div>

  <p class="muted" style="font-size:15px">Every word moves up a box each time you get it right: <b>1 day → 3 → 7 → 14 → 30</b>. You see it again right before you’d forget it. Get it wrong and it drops back to tomorrow — no XP lost, ever. Train 6 days a week; one missed day per week won’t break your streak.</p></div>`;
  document.querySelectorAll(".chip.th").forEach(c=>c.onclick=()=>{S.theme=c.dataset.th;save();rToday()});$("#startBtn").onclick=()=>session(due.slice(0,40),nNew);$("#shootBtn").onclick=shootout;const x=$("#extraBtn");if(x)x.onclick=()=>session([],Math.min(5,un))}

// ---------- session ----------
function session(dueIdx,nNew){const newIdx=unseen().slice(0,nNew);
  const items=[];shuffle(dueIdx).forEach(i=>items.push({kind:"q",i}));
  newIdx.forEach(i=>{items.push({kind:"learn",i})});
  // after learning, quiz new words twice in the same session (immediate retrieval practice)
  shuffle(newIdx).forEach(i=>items.push({kind:"q",i,isNew:true}));
  shuffle(newIdx).forEach(i=>items.push({kind:"q",i,isNew:true,second:true}));
  let k=0,ok=0,q=0,combo=0,wrongs=[];
  const total=items.length;
  const step=()=>{if(k>=total)return finish();const it=items[k];const pct=Math.round(k/total*100);
    if(it.kind==="learn"){const w=WORDS[it.i];if(!S.intro.includes(it.i)){S.intro.push(it.i);S.w[it.i]={b:1,d:Date.now()+DAY,l:0,c:0};logHist("nw",1)}
      const ls=sentOf(it.i),lf=ls.replace("___",w[0]);main.innerHTML=`<div class="prog"><i style="width:${pct}%"></i></div><p class="muted">New word ${newIdx.indexOf(it.i)+1} of ${newIdx.length}</p>
      <div class="wcard"><div><span class="word">${esc(w[0])}</span>${spk(w[0],w[0],true)}<span class="pos">${w[1]==="n"?"noun":w[1]==="v"?"verb":"adjective"}</span></div>
      <p style="font-size:20px;margin-top:10px">${esc(w[2])}</p>${S.zh?`<p class="zh">${esc(w[3])}</p>`:""}
      <p class="muted" style="margin-top:8px">Also: ${w[4].map(esc).join(", ")}${FORMS[w[0]]?` · Other forms: ${FORMS[w[0]].map(f=>esc(f[0])).join(", ")}`:""}</p>
      <p class="sent">${esc(ls).replace("___","<b>"+esc(w[0])+"</b>")}${spk(lf,sentKey(it.i,ls))}</p></div>
      <p class="kb">Say it out loud once, then picture the sentence. That is the fastest way to make it stick.</p>
      <button class="btn" style="margin-top:12px" id="nx">Got it</button>`;$("#nx").onclick=()=>{k++;addXP(5);step()};if(S.autoSay)setTimeout(()=>speak(w[0],w[0]),250);return}
    const Q=makeQ(it.i);q++;const w=WORDS[it.i];const sen=Q.type==="sent"?Q.prompt:sentOf(it.i);
    const head=Q.type==="form"?`<p class="muted">A different form of a word you know. What does it mean?</p><div class="word">${esc(Q.prompt)}${spk(Q.prompt,Q.prompt,true)}</div>`:Q.type==="syn"?`<p class="muted">Which word is closest in meaning to</p><div class="word">${esc(Q.prompt)}${spk(Q.prompt,Q.prompt,true)}</div>`:Q.type==="def"?`<p class="muted">What does this word mean?</p><div class="word">${esc(Q.prompt)}${spk(Q.prompt,Q.prompt,true)}</div>`:`<p class="muted">Fill in the blank</p><p class="sent">${esc(Q.prompt).replace("___","<b>______</b>")}</p>`;
    main.innerHTML=`<div class="prog"><i style="width:${pct}%"></i></div><p class="muted">${it.isNew?"New word check":"Review"} · ${k+1}/${total} ${combo>=3?`· 🔥 ${combo} combo`:""}</p>
    <div class="wcard">${head}</div><div class="opts">${Q.opts.map((o,n)=>`<button class="opt" data-o="${esc(o)}"><span class="k">${"ABCD"[n]}</span><span>${esc(o)}</span></button>`).join("")}</div><div id="fb"></div>`;
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const pick=b.dataset.o;const right=pick===Q.ans;document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.o===Q.ans)x.classList.add("ok");else if(x===b&&!right)x.classList.add("bad")});
      if(!it.second||!right){grade(it.i,right)}// second check of a new word only counts if wrong
      if(!it.isNew)logHist("rev",1);logHist("q",1);
      let gain;if(right){ok++;combo++;gain=10+(combo>=3?5:0)+(combo>=6?5:0);logHist("ok",1)}else{combo=0;gain=2;wrongs.push(it.i)}
      addXP(gain);logHist("xp",gain);
      $("#fb").innerHTML=`<div class="fb ${right?"":"bad"}"><b>${right?"Right.":"Not quite."}</b> ${Q.type==="form"?`<b>${esc(Q.prompt)}</b> = ${esc(Q.ans)} · from <b>${esc(w[0])}</b> = ${esc(w[2])}`:`<b>${esc(w[0])}</b> = ${esc(w[2])}`}${S.zh?` <span class="zh">(${esc(w[3])})</span>`:""}${Q.type==="sent"?spk(w[0],w[0]):""}<br><span class="muted">${esc(sen).replace("___",w[0])}</span>${spk(sen.replace("___",w[0]),sentKey(it.i,sen))}</div><button class="btn" style="margin-top:10px" id="nx">${right?"Next":"OK, next"}</button>`;
      $("#nx").onclick=()=>{k++;step()};$("#nx").focus();save()});
  };
  const finish=()=>{touchStreak();if(!S.badges.includes("first"))S.badges.push("first");if(q>=10&&ok===q&&!S.badges.includes("perfect")){S.badges.push("perfect")}checkBadges();save();report();
    const acc=q?Math.round(ok/q*100):100;
    main.innerHTML=`<div class="rink"><h1>Full time</h1>
    <div class="stat"><span>Questions</span><span class="v">${q}</span></div><div class="stat"><span>Accuracy</span><span class="v">${acc}%</span></div><div class="stat"><span>Streak</span><span class="v">🔥 ${S.streak}</span></div>
    ${wrongs.length?`<div class="blueline"><h3>Back to box 1 (you’ll see these tomorrow)</h3>${[...new Set(wrongs)].map(i=>`<div class="wl"><b>${esc(WORDS[i][0])}</b><span class="muted">${esc(WORDS[i][4][0])}${S.zh?" · "+esc(WORDS[i][3]):""}</span></div>`).join("")}</div>`:`<p style="margin-top:14px">Clean sheet. 🧤</p>`}
    <div class="row" style="margin-top:16px"><button class="btn" id="home">Back to Today</button>${S.intro.length>=8?`<button class="btn gold" id="sh">⚡ Penalty shootout</button>`:""}</div></div>`;
    $("#home").onclick=()=>{tab="today";render()};const sb=$("#sh");if(sb)sb.onclick=shootout};
  step()}

// ---------- shootout (speed round) ----------
function shootout(){const pool=shuffle(S.intro.slice());if(pool.length<8)return;let t=60,score=0,k=0,timer;
  const tick=()=>{t--;const e=$("#tm");if(e)e.textContent=t;if(t<=0){clearInterval(timer);end()}};
  const next=()=>{const i=pool[k%pool.length];k++;const Q=synQ(i);
    main.innerHTML=`<div class="row" style="justify-content:space-between;align-items:center"><span class="timer" id="tm">${t}</span><span class="disp" style="font-size:28px">🥅 ${score}</span></div>
    <div class="wcard" style="margin-top:8px"><p class="muted">Closest meaning</p><div class="word">${esc(Q.prompt)}</div></div>
    <div class="opts">${Q.opts.map((o,n)=>`<button class="opt" data-o="${esc(o)}"><span class="k">${"ABCD"[n]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(b.dataset.o===Q.ans){score++;b.classList.add("ok");setTimeout(next,150)}else{b.classList.add("bad");document.querySelectorAll(".opt").forEach(x=>{if(x.dataset.o===Q.ans)x.classList.add("ok")});setTimeout(next,700)}})};
  const end=()=>{const gain=score*3;addXP(gain);logHist("xp",gain);if(score>=15&&!S.badges.includes("speed15")){S.badges.push("speed15")}save();report();
    main.innerHTML=`<div class="rink"><h1>Shootout over</h1><div class="stat"><span>Goals</span><span class="v">${score}</span></div><div class="stat"><span>Bonus XP</span><span class="v">+${gain}</span></div><div class="row" style="margin-top:16px"><button class="btn" id="again">Play again</button><button class="btn ghost" id="home">Back to Today</button></div></div>`;
    $("#again").onclick=shootout;$("#home").onclick=()=>{tab="today";render()}};
  timer=setInterval(tick,1000);next()}

// ---------- words ----------
let wFilter="all",wSearch="",wLvl="all";
function rWords(){const now=Date.now();const list=WORDS.map((w,i)=>({w,i,s:ws(i)})).filter(x=>{if(wSearch&&!(x.w[0].includes(wSearch)||x.w[3].includes(wSearch)))return false;if(wLvl==="M"&&x.i>=MIDN)return false;if(wLvl==="U"&&x.i<MIDN)return false;
  if(wFilter==="due")return x.s.b>0&&x.s.d<=now;if(wFilter==="learning")return x.s.b>0&&x.s.b<4;if(wFilter==="mastered")return x.s.b>=4;if(wFilter==="new")return x.s.b===0;return true});
  main.innerHTML=`<h1>Word list</h1><input id="srch" placeholder="Search English or 中文" value="${esc(wSearch)}">
  <div class="chips">${[["all","All"],["due","Due"],["learning","Learning"],["mastered","Mastered"],["new","Not yet seen"]].map(f=>`<button class="chip ${wFilter===f[0]?"on":""}" data-f="${f[0]}">${f[1]}</button>`).join("")}</div>
  <p class="muted">${list.length} words</p>
  ${list.map(x=>`<button class="wl" data-i="${x.i}"><span><b>${esc(x.w[0])}</b> <span class="muted" style="font-size:14px">${esc(x.w[4][0])}</span></span><span class="pill ${x.s.b>0&&x.s.d<=now?"due":"b"+x.s.b}">${x.s.b===0?"new":x.s.b>=4?"mastered":x.s.d<=now?"due":"box "+x.s.b}</span></button>`).join("")}`;
  $("#srch").oninput=e=>{wSearch=e.target.value.toLowerCase();rWords()};document.querySelectorAll(".chip:not(.lv)").forEach(c=>c.onclick=()=>{wFilter=c.dataset.f;rWords()});document.querySelectorAll(".chip.lv").forEach(c=>c.onclick=()=>{wLvl=c.dataset.l;rWords()});
  document.querySelectorAll(".wl").forEach(b=>b.onclick=()=>showWord(+b.dataset.i))}
function showWord(i){const w=WORDS[i],s=ws(i);$("#modal").classList.remove("hidden");const ms=sentOf(i);$("#modal").innerHTML=`<div><div><span class="word">${esc(w[0])}</span>${spk(w[0],w[0],true)}<span class="pos">${w[1]}</span></div><p style="font-size:19px">${esc(w[2])}</p><p class="zh">${esc(w[3])}</p><p class="muted">Also: ${w[4].map(esc).join(", ")}${FORMS[w[0]]?` · Other forms: ${FORMS[w[0]].map(f=>esc(f[0])).join(", ")}`:""}</p><p class="sent">${esc(ms).replace("___","<b>"+esc(w[0])+"</b>")}${spk(ms.replace("___",w[0]),sentKey(i,ms))}</p>
  <p class="kb">${s.b===0?"Not introduced yet.":`Box ${s.b} · ${s.c} correct · ${s.l} misses · next review ${s.d<=Date.now()?"now":new Date(s.d).toLocaleDateString()}`}</p><button class="btn ghost" id="cl">Close</button></div>`;$("#cl").onclick=()=>$("#modal").classList.add("hidden")}

// ---------- plan ----------
function rPlan(){const d=daysToExam();const pc=pace();const total=WORDS.length;const exam=new Date(S.exam+"T00:00:00");
  const fmt=x=>(x.getMonth()+1)+"/"+x.getDate();const start=new Date();const p1end=new Date(exam-28*DAY),p2end=new Date(exam-14*DAY),p3end=new Date(exam-3*DAY);
  const phase=start>p3end?3:start>p2end?2:start>p1end?1:0;
  main.innerHTML=`<h1>Game plan</h1><p class="muted">Exam: ${S.exam} · ${d} days away · ${pc.left} of ${total} words not yet introduced</p>
  <div class="phase ${phase===0?"now":""}"><div class="w">Now → ${fmt(p1end)}</div><div><b>Build the squad.</b> ${WORDS.length} ISEE Middle Level words. ${pc.rec} new words a day, 6 days a week, plus every review that comes due. About 10–12 minutes. All ${total} words should be introduced by ${fmt(p1end)}.</div></div>
  <div class="phase ${phase===1?"now":""}"><div class="w">${fmt(p1end)} → ${fmt(p2end)}</div><div><b>Lock them in.</b> Few or no new words. Reviews only — the 7- and 14-day boxes come due now, which is exactly when memories are weakest. One penalty shootout a day to build speed.</div></div>
  <div class="phase ${phase===2?"now":""}"><div class="w">${fmt(p2end)} → ${fmt(p3end)}</div><div><b>Exam mode.</b> Reviews plus two penalty shootouts a day. Use the Words tab to re-read anything still in boxes 1–3. Aim for 90%+ accuracy in sessions.</div></div>
  <div class="phase ${phase===3?"now":""}"><div class="w">Last 3 days</div><div><b>Taper.</b> One short review session a day, no new material. Sleep matters more than cramming now.</div></div>
  <div class="blueline"><h3>Weekly rhythm</h3>
  <p style="font-size:15px">Mon–Sat: one shift (reviews + new words). Sun: rest day, or a penalty shootout for fun — the streak allows one skipped day per week.</p>
  <p style="font-size:15px" class="muted">Why it works: the app schedules each word at 1, 3, 7, 14 and 30 days — the points where you are just about to forget it. Reviewing right before forgetting is what turns short-term recall into long-term memory. Testing yourself (not re-reading) and mixing question types does the rest.</p></div>`}

// ---------- stats ----------
function rStats(){const counts=[0,0,0,0,0,0];WORDS.forEach((_,i)=>counts[ws(i).b]++);const max=Math.max(...counts,1);const m=masteredCount();
  const days=[];for(let k=6;k>=0;k--){const dt=new Date(Date.now()-k*DAY);const key=todayKey(dt);days.push({key,h:S.hist[key]})}
  main.innerHTML=`<h1>Stat sheet</h1>
  <div class="stat"><span>Words mastered (box 4+)</span><span class="v">${m} / ${WORDS.length}</span></div>
  <div class="stat"><span>Words introduced</span><span class="v">${S.intro.length}</span></div>
  <div class="stat"><span>Best streak</span><span class="v">${S.best}</span></div>
  <div class="stat"><span>Total XP</span><span class="v">${S.xp}</span></div>
  <div class="blueline"><h3>Where your words are</h3>
  <div class="boxes">${counts.map((c,b)=>`<div class="${b>=4?"m":""}" style="height:${Math.round(c/max*100)}%"><span>${c}</span></div>`).join("")}</div>
  <div class="blab"><span>new</span><span>1 day</span><span>3 days</span><span>7 days</span><span>14 days</span><span>30 days</span></div></div>
  <div class="blueline"><h3>Last 7 days</h3>${days.map(x=>`<div class="stat"><span>${x.key.slice(5)}</span><span>${x.h?`${x.h.q} questions · ${x.h.q?Math.round(x.h.ok/x.h.q*100):0}% · ${x.h.nw} new · +${x.h.xp} XP`:"<span class='muted'>—</span>"}</span></div>`).join("")}</div>
  <div class="blueline"><h3>Badges</h3><div class="badges">${BADGES.map(b=>`<div class="badge ${S.badges.includes(b[0])?"got":""}"><div class="e">${b[2]}</div><b>${b[1]}</b><div class="muted">${b[3]}</div></div>`).join("")}</div></div>`}

// ---------- settings ----------
function rSettings(){const pc=pace();
  main.innerHTML=`<h1>Setup</h1>
  <label class="f">Player name</label><input id="nm" value="${esc(S.name)}">
  <label class="f">Exam date</label><input id="ex" type="date" value="${S.exam}">
  <label class="f">New words per day (recommended now: ${pc.rec})</label><input id="pd" type="number" min="3" max="15" value="${S.perDay}">
  <div class="tog" style="margin-top:14px"><span>Auto-play word audio on new-word cards</span><button class="sw ${S.autoSay?"on":""}" id="as" aria-label="Toggle auto-play"></button></div>
  <div class="tog"><span>Show Chinese meaning</span><button class="sw ${S.zh?"on":""}" id="zh" aria-label="Toggle Chinese"></button></div>
  <button class="btn" style="margin-top:16px" id="sv">Save setup</button>
  <div class="note">Progress is saved on this device${dbRef?" and synced to your account":""}. App version 2026-10-19a. Parents: the Stats tab is the report card.</div>
  <div class="blueline"><h3>Voice</h3><p class="muted" style="font-size:14px">Tap 🔊 anywhere to hear a word or sentence. Natural voice clips play from the site’s audio pack; if a clip is missing, the device voice is used.</p><button class="btn ghost sm" id="dl">Download audio pack for offline</button></div>
  <div class="blueline"><h3>Parent report</h3><p class="muted" style="font-size:14px">Paste the Google Apps Script web-app URL here. After every session the app sends a one-line summary (and a backup) to that spreadsheet.</p><input id="ru" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(S.reportUrl||"")}"><div class="row" style="margin-top:8px"><button class="btn ghost sm" id="rt">Send a test report</button></div></div>
  <div class="blueline"><h3>Backup</h3><p class="muted" style="font-size:14px">Copy this code to move progress to another device, or paste a code to restore.</p><div class="row"><button class="btn ghost sm" id="exp">Export progress</button><button class="btn ghost sm" id="imp">Import progress</button></div><textarea id="bk" style="width:100%;height:80px;margin-top:8px;font:13px monospace;border:2px solid var(--line);border-radius:8px;background:var(--ice2);color:var(--ink)" placeholder="Progress code appears here / paste a code here"></textarea></div>
  <div class="rink"><button class="btn ghost" id="rs">Reset all progress</button></div>`;
  $("#exp").onclick=()=>{$("#bk").value=btoa(unescape(encodeURIComponent(JSON.stringify(S))));$("#bk").select();try{navigator.clipboard.writeText($("#bk").value);toast("Copied")}catch(e){}};
  $("#imp").onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($("#bk").value.trim()))));if(!o.w)throw 0;if(confirm("Replace current progress with this code?")){S=Object.assign(fresh(),o);save();toast("Imported");tab="today";render()}}catch(e){alert("That code is not valid.")}};
  $("#rt").onclick=()=>{S.reportUrl=$("#ru").value.trim();save();if(!S.reportUrl){alert("Paste a URL first.");return}report();toast("Sent — check the sheet")};
  $("#zh").onclick=()=>{S.zh=!S.zh;$("#zh").classList.toggle("on",S.zh)};$("#as").onclick=()=>{S.autoSay=!S.autoSay;$("#as").classList.toggle("on",S.autoSay);save()};
  $("#dl").onclick=async()=>{const keys=audioKeys();const b=$("#dl");b.disabled=true;let ok=0,miss=0;for(let i=0;i<keys.length;i+=6){await Promise.all(keys.slice(i,i+6).map(k=>fetch(AUDIO_BASE+encodeURIComponent(k)+".mp3").then(r=>{r.ok?ok++:miss++}).catch(()=>miss++)));b.textContent=`Downloading… ${ok+miss}/${keys.length}`}b.textContent=miss>keys.length/2?"No audio pack found on this site":`Audio saved for offline (${ok} clips)`};
  $("#sv").onclick=()=>{S.reportUrl=$("#ru").value.trim();S.name=$("#nm").value.trim();S.exam=$("#ex").value||S.exam;S.perDay=Math.max(3,Math.min(15,+$("#pd").value||8));save();toast("Saved");tab="today";render()};
  $("#rs").onclick=()=>{if(confirm("Reset everything? This cannot be undone."))  {const nm=S.name,ex=S.exam;S=fresh();S.name=nm;S.exam=ex;save();render()}}}

// ---------- boot ----------
load();render();if(S.pending&&navigator.onLine)report();
if(!S.name){$("#modal").classList.remove("hidden");$("#modal").innerHTML=`<div><h2>Welcome to Word Pitch</h2><p class="muted">ISEE Middle Level vocabulary training — ${WORDS.length} words, scheduled so you review each one right before you’d forget it.</p><label class="f">Your name</label><input id="n0" placeholder="e.g. Ian"><label class="f">Exam date</label><input id="e0" type="date" value="${S.exam}"><button class="btn" style="margin-top:14px" id="go">Kick off</button></div>`;
  $("#go").onclick=()=>{S.name=$("#n0").value.trim()||"Player";S.exam=$("#e0").value||S.exam;save();$("#modal").classList.add("hidden");render()}}
cloudInit();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")r.update().catch(()=>{})})}).catch(()=>{});let reloaded=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloaded||document.querySelector(".opt"))return;reloaded=true;location.reload()})}
</script>
</body>
</html>
